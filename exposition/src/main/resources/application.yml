server:
  port: 8080

spring:
  application:
    name: payment-account-api

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_account_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:my-very-secret-key-that-is-at-least-256-bits-long-for-hs256}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.demo.accountapi: INFO
    org.springframework.security: WARN
