version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: payment-account-postgres
    environment:
      POSTGRES_DB: payment_account_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: payment-account-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_account_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: my-very-secret-key-that-is-at-least-256-bits-long-for-hs256

volumes:
  postgres_data:
