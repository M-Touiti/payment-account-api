name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests)
        run: mvn clean install -DskipTests

      - name: Unit tests
        run: mvn test -pl exposition -Dtest=AccountServiceTest

      - name: Integration tests
        run: mvn test -pl exposition -Dtest=AuthControllerIntegrationTest
